[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Proxy API calls to the Vercel-hosted backend.
[[redirects]]
  from = "/api/*"
  to = "https://vwaran-api.vercel.app/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (e.g. /admin-login) resolve on refresh/direct hit
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
